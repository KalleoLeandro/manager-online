<details class="strategy-box" open><summary>Estratégia coletiva <span>Passes, ritmo e organização defensiva</span></summary><div class="strategy-grid">@for(slider of sliders;track slider.key){<label [title]="slider.hint"><strong>{{slider.label}}<output>{{plan()[slider.key]}}</output></strong><input type="range" min="0" max="100" step="5" [attr.aria-label]="slider.label" [ngModel]="plan()[slider.key]" (ngModelChange)="change(slider.key,$event)" [disabled]="locked()"><span><small>{{slider.low}}</small><small>{{slider.high}}</small></span><p>{{slider.hint}}</p></label>}</div><div class="strategy-switches"><label><input type="checkbox" [ngModel]="plan().counterAttack" (ngModelChange)="toggle('counterAttack',$event)" [disabled]="locked()"> Contra-ataques <small>Explorar o espaço atrás de linhas avançadas.</small></label><label><input type="checkbox" [ngModel]="plan().offsideTrap" (ngModelChange)="toggle('offsideTrap',$event)" [disabled]="locked()"> Linha de impedimento <small>Aumenta os impedimentos provocados e exige coordenação.</small></label></div></details>
