<div class="speed-control"><label for="match-speed">Velocidade<select id="match-speed" aria-label="Velocidade da partida" [ngModel]="percent()" (ngModelChange)="changed.emit(+$event)" [disabled]="!allowed()||busy()"><option [ngValue]="50">0,5× · Lenta</option><option [ngValue]="100">1× · Normal</option><option [ngValue]="200">2× · Rápida</option><option [ngValue]="400">4× · Muito rápida</option></select></label><small>{{busy()?'Aplicando velocidade…':local()?'Ritmo compartilhado · controle do criador':allowed()?'Seu ritmo de jogo':'Velocidade padrão da liga online'}}</small></div>
