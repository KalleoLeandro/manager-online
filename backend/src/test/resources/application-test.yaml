spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  datasource:
    url: "jdbc:h2:mem:manager-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SELECT 1"
  transaction:
    default-timeout: 180s
  sql:
    init:
      mode: always

app:
  finance:
    require-season-approval: false
  matchday:
    tick-millis: 1500
    narrated-pacing: false
    enabled: false
  leagues:
    cleanup:
      enabled: false

logging:
  level:
    root: WARN
    org.springframework: WARN
