services:
  postgres:
    build:
      context: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manager}
      POSTGRES_USER: ${POSTGRES_USER:-manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/src/main/resources/res/players:/app/portraits:ro
      - ./backend/src/main/resources/res/crests:/app/crests:ro
    environment:
      PLAYER_PORTRAITS_DIR: /app/portraits
      CLUB_CRESTS_DIR: /app/crests
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manager}
      DATABASE_USER: ${POSTGRES_USER:-manager}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
