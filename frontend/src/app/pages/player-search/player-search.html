<section class="search-panel"><form (ngSubmit)="search()"><label for="player-search">Nome do jogador</label><div><input id="player-search" name="query" type="search" maxlength="80" minlength="2" required placeholder="Digite pelo menos 2 caracteres" [ngModel]="query()" (ngModelChange)="query.set($event)"><button type="submit" [disabled]="loading()||query().trim().length<2">{{loading()?'Buscando…':'Buscar'}}</button></div></form><p>Busca nos elencos profissionais desta liga. Até 60 resultados por consulta.</p>@if(error()){<p role="alert">{{error()}}</p>}<div class="search-results">@for(result of results();track result.player.id){<button type="button" class="search-result" (click)="selected.set(result)"><app-player-portrait [playerId]="result.player.id"/><span><strong>{{result.player.name}}</strong><small>{{result.teamName}} · {{result.player.position}} · {{result.player.age||'—'}} anos</small></span><b>{{result.player.ability}}</b></button>}@empty{@if(searched()){<p role="status">Nenhum jogador encontrado.</p>}}</div></section>@if(selected();as result){<app-player-details [player]="result.player" [squad]="[result.player]" [showComparison]="false" [teamName]="result.teamName" (closed)="selected.set(null)"/>}
