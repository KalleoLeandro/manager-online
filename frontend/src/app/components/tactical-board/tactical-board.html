<div class="tactical-pitch"><div class="mark halfway"></div><div class="mark centre"></div><div class="mark penalty top"></div><div class="mark penalty bottom"></div>
  @for (slot of slots(); track slot.index) {
    <button type="button" class="footballer" [class.active]="active()===slot.index" [style.left.%]="slot.x" [style.top.%]="slot.y" [attr.aria-label]="'Selecionar posição ' + slot.role + ': ' + (slot.player?.name || 'Vaga')" (click)="active.set(slot.index)">
      <span class="shirt">{{ slot.player?.number || slot.index+1 }}</span><strong>{{ slot.player?.name || 'Escolher' }}</strong><small>{{ slot.player?.ability || '—' }} · {{ slot.role }}</small>
    </button>
  }
</div>
<div class="slot-editor"><label for="slot-player">{{ roleList()[active()] }} · Vaga {{ active()+1 }}</label><select id="slot-player" [disabled]="locked()" [value]="lineup()[active()]" (change)="change.emit({index:active(),playerId:+$any($event.target).value})"><option value="" disabled>Escolha um jogador</option>@for (player of options(); track player.id) { <option [value]="player.id" [disabled]="used(player.id)||!available(player)">{{ player.name }} · {{ player.ability }}{{ !available(player)?' (indisponível)':used(player.id)?' (titular)':'' }}</option> }</select><small>Toque em uma posição para trocar o titular.</small></div>
